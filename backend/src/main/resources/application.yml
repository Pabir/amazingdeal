server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: amazingdeal-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:cloud}
  
  # Default Cloud Profile: Neon Serverless Postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://ep-rough-fire-b4tti27m-pooler.c-6.us-east-2.aws.neon.tech:5432/amazingdeal?sslmode=require}
    username: ${DB_USER:amazingdeal_owner}
    password: ${DB_PASSWORD:npg_HoOfLN3E4FDG}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

# App Custom Configurations
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins:
      - "https://amazingdeal.co.in"
      - "https://*.amazingdeal.co.in"
      - "https://admin.amazingdeal.co.in"
      - "https://*.workers.dev"
      - "https://*.pages.dev"
      - "https://*.onrender.com"
      - "http://localhost:5173"
      - "http://localhost:5174"
