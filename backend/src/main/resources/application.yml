  cloudflare:
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket-name: ${R2_BUCKET_NAME:amazingdeal-media}
      public-domain: ${R2_PUBLIC_DOMAIN:https://media.amazingdeal.co.in}
  meta:
    whatsapp:
      api-token: ${WHATSAPP_API_TOKEN:}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  payu:
    key: ${PAYU_KEY:uiw0jf}
    salt: ${PAYU_SALT:saPx7EYtKYEEgOuBSjyoVvrncKIjZ2LJ}
    mode: ${PAYU_MODE:production}
    surl: ${PAYU_SURL:https://amazingdeal-backend.onrender.com/api/v1/payu/callback}
    furl: ${PAYU_FURL:https://amazingdeal-backend.onrender.com/api/v1/payu/callback}
    frontend-url: ${PAYU_FRONTEND_URL:https://amazingdeal-storefront.drskpabirulislam1995.workers.dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
# Fallback Profile: Dev/H2 when Neon DB is not yet connected
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:amazingdeal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
