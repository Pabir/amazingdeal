name: AmazingDeal Cloud CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Test and verify backend Spring Boot container
  test-backend:
    name: Build & Test Backend (Spring Boot 3.3 / Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw test

  # 2. Build and deploy Merchant Admin to Cloudflare Workers
  deploy-admin:
    name: Deploy Merchant Admin to Cloudflare Workers
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Build Admin SPA
        run: |
          cd frontend-admin
          npm ci
          npm run build
        env:
          VITE_API_URL: https://amazingdeal-backend.onrender.com

      - name: Deploy to Cloudflare Workers (amazingdeal-admin)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-admin
          command: deploy
          wranglerVersion: "3.x"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Cloudflare Deployment Status Notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice title=Cloudflare Deploy Skipped::CLOUDFLARE_API_TOKEN secret is not set in GitHub repository settings. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Repository Settings -> Secrets and variables -> Actions to enable automatic edge deployment."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # 3. Build and deploy Storefront to Cloudflare Workers
  deploy-storefront:
    name: Deploy Storefront to Cloudflare Workers
    needs: [test-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-storefront/package-lock.json

      - name: Build Storefront SPA
        run: |
          cd frontend-storefront
          npm ci
          npm run build
        env:
          VITE_API_URL: https://amazingdeal-backend.onrender.com

      - name: Deploy to Cloudflare Workers (amazingdeal-storefront)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend-storefront
          command: deploy
          wranglerVersion: "3.x"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Cloudflare Deployment Status Notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::notice title=Cloudflare Deploy Skipped::CLOUDFLARE_API_TOKEN secret is not set in GitHub repository settings. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Repository Settings -> Secrets and variables -> Actions to enable automatic edge deployment."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
