version: '3.8'

services:
  # 1. Spring Boot 3.3 Backend API (Connected to Cloud Neon PostgreSQL)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: amazingdeal-backend
    restart: always
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: cloud
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://ep-rough-fire-b4tti27m-pooler.c-6.us-east-2.aws.neon.tech:5432/amazingdeal?sslmode=require}
      DB_USER: ${DB_USER:-amazingdeal_owner}
      DB_PASSWORD: ${DB_PASSWORD:-npg_HoOfLN3E4FDG}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-amazingdeal-media}
    ports:
      - "8080:8080"

  # 2. Automatic HTTPS Reverse Proxy (Caddy with Let's Encrypt SSL)
  caddy:
    image: caddy:2-alpine
    container_name: amazingdeal-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
