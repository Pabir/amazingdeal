version: '3.8'

services:
  # 1. Cloud PostgreSQL Database on OCI VM
  postgres:
    image: postgres:16-alpine
    container_name: amazingdeal-postgres
    restart: always
    environment:
      POSTGRES_DB: amazingdeal
      POSTGRES_USER: ${DB_USER:-amazingdeal_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AmazingDealSecurePass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-amazingdeal_admin} -d amazingdeal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Spring Boot 3.3 Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: amazingdeal-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: cloud
      DATABASE_URL: jdbc:postgresql://postgres:5432/amazingdeal
      DB_USER: ${DB_USER:-amazingdeal_admin}
      DB_PASSWORD: ${DB_PASSWORD:-AmazingDealSecurePass2026!}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-amazingdeal-media}
    ports:
      - "8080:8080"

  # 3. Automatic HTTPS Reverse Proxy (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: amazingdeal-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
